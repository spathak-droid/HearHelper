<div class="signup-page">
  <header class="signup-header">
    <div>
      <p class="eyebrow">Create your Hear Helper profile</p>
      <h1>Sign up for HearHelper</h1>
      <p class="intro">
        Save your progress, swap devices, and unlock more curated public-domain books.
      </p>
    </div>
    <a routerLink="/" class="back-link">← Back to assistant</a>
  </header>

  <section class="signup-card">
    <form class="signup-form"
          #signUpForm="ngForm"
          (submit)="onSignUp(); $event.preventDefault()"
          novalidate>
      <div class="name-row">
        <label
          [class.invalid]="firstName.invalid && firstName.touched">
          First name
          <input type="text"
                 name="firstName"
                 placeholder="Sherlock"
                 [(ngModel)]="formData.firstName"
                 #firstName="ngModel"
                 required>
          <span class="error-text" *ngIf="firstName.invalid && firstName.touched">
            First name is required.
          </span>
        </label>
        <label [class.invalid]="lastName.invalid && lastName.touched">
          Last name
          <input type="text"
                 name="lastName"
                 placeholder="Holmes"
                 [(ngModel)]="formData.lastName"
                 #lastName="ngModel"
                 required>
          <span class="error-text" *ngIf="lastName.invalid && lastName.touched">
            Last name is required.
          </span>
        </label>
      </div>

      <label [class.invalid]="email.invalid && email.touched">
        Email
        <input type="email"
               name="email"
               placeholder="you@example.com"
               [(ngModel)]="formData.email"
               #email="ngModel"
               [pattern]="emailPattern"
               required>
        <span class="error-text" *ngIf="email.invalid && email.touched">
          Enter a valid email address.
        </span>
      </label>

      <label class="password-field"
             [class.invalid]="password.invalid && password.touched">
        Password
        <div class="password-input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'"
                 name="password"
                 placeholder="Create a password"
                 minlength="8"
                 [pattern]="passwordPattern"
                 [(ngModel)]="formData.password"
                 #password="ngModel"
                 required>
          <button type="button"
                  class="eye-button"
                  (click)="togglePasswordVisibility()"
                  aria-label="Toggle password visibility">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="error-text" *ngIf="password.invalid && password.touched">
          Must be 8+ chars, include one uppercase & one symbol.
        </span>
      </label>

      <button type="submit"
              class="primary-btn"
              [disabled]="!signUpForm.valid">
        Create account
      </button>
    </form>

    <div class="signin-cta">
      Already have an account?
      <a routerLink="/signin">Sign in</a>
    </div>
  </section>
</div>
