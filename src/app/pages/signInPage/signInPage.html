<div class="signin-page">
  <header class="signin-header">
    <div>
      <p class="eyebrow">Welcome back</p>
      <h1>Sign in to Hear Helper</h1>
      <p class="intro">
        Continue listening across devices, pick up your books, and unlock more personalized voices.
      </p>
    </div>
    <a routerLink="/" class="back-link">← Back to assistant</a>
  </header>

  <section class="signin-options">
    <button class="google-button" type="button" (click)="onGoogleSignIn()">
      <span class="google-icon">G</span>
      Continue with Google
    </button>

    <div class="divider">
      <span></span>
      <p>or use email</p>
      <span></span>
    </div>

    <form class="signin-form"
          #signInForm="ngForm"
          (submit)="onManualSignIn(); $event.preventDefault()"
          novalidate>
      <label [class.invalid]="email.invalid && email.touched">
        Email
        <input type="email"
               name="email"
               placeholder="you@example.com"
               [(ngModel)]="credentials.email"
               #email="ngModel"
               [pattern]="emailPattern"
               required>
        <span class="error-text" *ngIf="email.invalid && email.touched">
          Enter a valid email address.
        </span>
      </label>
      <label class="password-field"
             [class.invalid]="password.invalid && password.touched">
        Password
        <div class="password-input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'"
                 name="password"
                 placeholder="••••••••"
                 [pattern]="passwordPattern"
                 [(ngModel)]="credentials.password"
                 #password="ngModel"
                 required>
          <button type="button"
                  class="eye-button"
                  (click)="togglePasswordVisibility()"
                  aria-label="Toggle password visibility">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="error-text" *ngIf="password.invalid && password.touched">
          Must include one uppercase letter and one symbol.
        </span>
      </label>
      <button type="submit"
              class="primary-btn"
              [disabled]="!signInForm.valid">
        Sign in
      </button>
    </form>

    <div class="signup-cta">
      Don’t have an account?
      <a routerLink="/signup">Sign up here</a>
    </div>
  </section>
</div>
