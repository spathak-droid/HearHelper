@if (inactivityNotice()) {
  <div class="inactivity-overlay">
    <div class="inactivity-card">
      <h3>Your session has timed out</h3>
      <p>Please sign in to continue.</p>
    </div>
  </div>
}

<div class="global-actions" [style.opacity]="globalActionsOpacity()">
  <button class="global-signin-icon"
          type="button"
          [attr.aria-label]="session() ? 'Open profile for ' + userDisplayName() : 'Open profile menu'"
          (click)="showGlobalMenu = !showGlobalMenu">
    <span class="signin-avatar">
      <img [src]="avatarUrl()"
           [style.object-position]="avatarObjectPosition()"
           alt="Profile avatar preview">
    </span>
  </button>

  <a class="global-home-icon"
     routerLink="/"
     aria-label="Home">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </a>
</div>

<div class="global-profile-backdrop" *ngIf="showGlobalMenu" (click)="closeGlobalMenu()"></div>

<div class="global-profile-menu" [class.open]="showGlobalMenu">
  <div class="profile-menu-header">
    <span class="profile-menu-name">{{ userDisplayName() }}</span>
  </div>
  <div class="profile-picture-edit" [class.disabled]="!session()">
    <div class="avatar-preview-wrapper">
      <img [src]="avatarUrl()" [style.object-position]="avatarObjectPosition()" alt="Profile preview">
      <label class="avatar-upload-chip"
             [class.disabled]="!session()"
             aria-label="Upload photo">
        <input type="file"
               accept="image/*"
               [disabled]="!session()"
               (change)="onAvatarSelected($event)">
        <span class="material-icons">photo_camera</span>
      </label>
    </div>
    <p class="upload-hint" *ngIf="session()">Use a clear square image (JPG/PNG).</p>
  </div>
  <p class="profile-menu-subtext" *ngIf="session()?.user?.email as email">
    {{ email }}
  </p>
  <ul class="profile-menu-list">
    <ng-container *ngIf="session(); else loggedOutLinks">
      <li routerLink="/generate-audio" (click)="showGlobalMenu = false">
        <span class="menu-icon material-icons">graphic_eq</span>
        <span>Generate audio</span>
      </li>
    </ng-container>
    <ng-template #loggedOutLinks>
      <li routerLink="/signin" (click)="showGlobalMenu = false">
        <span class="menu-icon material-icons">lock</span>
        <span>Sign in</span>
      </li>
      <li routerLink="/signup" (click)="showGlobalMenu = false">
        <span class="menu-icon material-icons">auto_awesome</span>
        <span>Sign up</span>
      </li>
    </ng-template>
    <li routerLink="/payment" (click)="showGlobalMenu = false">
      <span class="menu-icon material-icons">credit_card</span>
      <span>Payment</span>
    </li>
    <li routerLink="/help" (click)="showGlobalMenu = false">
      <span class="menu-icon material-icons">help_outline</span>
      <span>Help</span>
    </li>
  </ul>
  <button class="profile-signout-btn"
          type="button"
          *ngIf="session()"
          (click)="onSignOut()">
    <span class="menu-icon material-icons">logout</span>
    <span>Sign out</span>
  </button>
</div>

<router-outlet />
